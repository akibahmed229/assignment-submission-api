services:
  postgres:
    image: postgres:16-alpine
    container_name: assignment-submission-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_submission_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - assignment_submission_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the API in Docker too. Comment out while you're actively
  # developing locally with `dotnet watch` -- it's here for parity/demo purposes.
  # api:
  #   build:
  #     context: .
  #     dockerfile: src/AssignmentSubmissionSystem.API/Dockerfile
  #   container_name: assignment-submission-api
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "5000:8080"
  #   env_file:
  #     - .env

volumes:
  assignment_submission_pgdata:
