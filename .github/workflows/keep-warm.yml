name: Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  # Allows manually triggering the workflow from the GitHub Actions tab
  workflow_dispatch:


jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -s -f -o /dev/null -w "HTTP Status: %{http_code}\n" https://assignment-submission-api-bd69.onrender.com/swagger/index.html
